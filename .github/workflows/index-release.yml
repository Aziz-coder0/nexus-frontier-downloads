name: Generate app update metadata
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to index
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nexus-update-metadata
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Find the release assets
        id: release
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets > release.json
          if jq -e '.isDraft or .isPrerelease or (.assets | any(.name == "nexus-release.json"))' release.json >/dev/null; then
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          if jq -e --arg name "Nexus-Frontier-$version.apk" '.assets | any(.name == $name)' release.json >/dev/null; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          fi
          echo 'index=true' >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@v4
        if: steps.release.outputs.android == 'true'
        with:
          cmdline-tools-version: '12266719'
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify app builds and upload metadata
        if: steps.release.outputs.index == 'true'
        run: python3 scripts/index-release.py

